# Optional overlay on the existing WorkHub app and persistent data volume.
services:
  app:
    environment:
      USOPP_PERFORMANCE_POLL_SECONDS: ${USOPP_PERFORMANCE_POLL_SECONDS:-30}
      USOPP_PASSPORT_MAX_FILE_BYTES: ${USOPP_PASSPORT_MAX_FILE_BYTES:-104857600}
      USOPP_PASSPORT_STORAGE_BYTES: ${USOPP_PASSPORT_STORAGE_BYTES:-10737418240}
      USOPP_WORKHUB_TIMEZONE: ${USOPP_WORKHUB_TIMEZONE:-Asia/Kolkata}
